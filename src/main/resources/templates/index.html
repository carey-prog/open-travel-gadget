<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>规划行程 · 旅游神器</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="module-page">
<div class="page">
    <header th:replace="~{fragments/layout :: site-header(${activeNav})}"></header>

    <div class="hero-banner">
        <p class="hero-emoji">🚄 ✈️ 🗺️</p>
        <h2>全国旅游城市 · 智能行程规划</h2>
        <p class="hint">选择<strong>出发地</strong>与<strong>目的地</strong>，获取高铁/飞机/火车大交通建议 + 每日玩法</p>
        <div class="badge-row" id="keyBadges">
            <span class="badge badge-warn">检测 API 配置中…</span>
        </div>
    </div>

    <section class="card step-card">
        <div class="step-tab teal"><span class="step-num">1</span> 行程参数</div>
        <div class="card-body">
            <label class="field-label">出发地</label>
            <select id="departureSelect" class="select-input"></select>

            <label class="field-label">目的地</label>
            <select id="destinationSelect" class="select-input"></select>
            <p class="sub-hint" id="destinationHint"></p>

            <label class="field-label">计划出发日</label>
            <input type="date" id="departureDate" class="select-input">

            <label class="field-label">大交通偏好</label>
            <div class="chip-row" id="transportChips"></div>

            <label class="field-label">游玩天数</label>
            <div class="chip-row" id="daysChips">
                <button type="button" class="chip-btn" data-days="2">2 天</button>
                <button type="button" class="chip-btn active" data-days="3">3 天</button>
                <button type="button" class="chip-btn" data-days="4">4 天</button>
                <button type="button" class="chip-btn" data-days="5">5 天</button>
            </div>

            <label class="field-label">同行人类型</label>
            <div class="chip-row" id="travelerChips"></div>

            <label class="field-label">预算档次</label>
            <div class="chip-row" id="budgetChips"></div>

            <label class="field-label">主题偏好</label>
            <div class="chip-row" id="themeChips"></div>

            <label class="field-label">补充要求</label>
            <textarea id="customRequire" rows="3" placeholder="例如：想坐高铁、带老人节奏慢、必去某个景点"></textarea>
        </div>
    </section>

    <section class="card step-card">
        <div class="step-tab coral"><span class="step-num">2</span> 确认方案</div>
        <div class="card-body">
            <div class="config-box">
                <div class="config-title">当前方案</div>
                <div id="configSummary">加载预设中…</div>
            </div>
            <button type="button" class="primary-btn" id="generateBtn">生成行程方案</button>
            <p class="sub-hint center">约 1～3 分钟 · RAG 攻略 → 联网校验 → AI 生成（含大交通建议）</p>
        </div>
    </section>

    <section class="card step-card" id="chatSection" hidden>
        <div class="step-tab blue"><span class="step-num">4</span> 对话改行程</div>
        <div class="card-body">
            <p class="hint">生成后可继续用自然语言调整，例如「改坐飞机」「第二天轻松一点」</p>
            <div class="chat-quick" id="chatQuick">
                <button type="button" class="chip-btn quick-refine" data-msg="大交通改为飞机优先，并更新 D1 安排">改飞机出行</button>
                <button type="button" class="chip-btn quick-refine" data-msg="整体节奏轻松一点，每天少安排景点">轻松节奏</button>
                <button type="button" class="chip-btn quick-refine" data-msg="增加当地特色美食推荐">加强美食</button>
            </div>
            <div class="chat-log" id="chatLog"></div>
            <div class="chat-input-row">
                <input type="text" id="refineInput" placeholder="描述你想怎么改…" maxlength="500">
                <button type="button" class="secondary-btn" id="refineBtn">发送</button>
            </div>
        </div>
    </section>

    <section class="card step-card">
        <div class="step-tab blue"><span class="step-num">3</span> 行程结果</div>
        <div class="card-body result-area" id="resultArea">
            <div class="empty-result">
                <div class="star-box">🗺️</div>
                <p>你的专属行程将在这里呈现</p>
                <p class="sub-hint">选择出发地、目的地后点击「生成行程方案」</p>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: site-footer}"></footer>
</div>

<div class="loading-overlay" id="loadingOverlay" hidden>
    <div class="loading-box">
        <div class="spinner"></div>
        <p id="loadingText">正在规划行程…</p>
        <p class="sub-hint" id="loadingSubText">检索攻略与交通信息</p>
        <div class="loading-steps">
            <span class="loading-step-tag">RAG</span>
            <span class="loading-step-tag">联网</span>
            <span class="loading-step-tag">行程</span>
            <span class="loading-step-tag">保存</span>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
